# Terrain capture and rendering limits. Map colors are calculated from immutable
# chunk snapshots off-thread and applied to map data on the server thread.
rendering:
  # Missing generated chunks are loaded asynchronously. New terrain is not generated by default.
  generate-missing-chunks: false
  # Scale 3 and 4 maps can cover thousands of chunks. Raise this only after load testing.
  max-chunks-per-map: 4096
  max-pending-maps: 256

map-walls:
  max-frames: 256
  # Automatic walls default to scale 0 or 1 to keep refresh work bounded.
  max-scale: 1
  discovery-span: 24
  minimum-refresh-minutes: 5
  defaults:
    refresh-minutes: 30
    locked: true
    player-markers: false
    # Off by default so placing an ordinary adjacent frame never changes it unexpectedly.
    auto-expand: false
