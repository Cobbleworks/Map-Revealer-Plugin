# Terrain capture and rendering limits. Map colors are calculated from immutable
# chunk snapshots off-thread and applied to map data on the server thread.
config-version: 2
rendering:
  # Missing generated chunks are loaded asynchronously. New terrain is not generated by default.
  generate-missing-chunks: false
  # Scale 3 and 4 maps can cover thousands of chunks. Raise this only after load testing.
  max-chunks-per-map: 16384
  # Limit concurrent loads/snapshots. Large maps are sampled in strips to bound memory usage.
  capture-chunks-per-tick: 16
  # Missing terrain needs no snapshot. Bound async existence/load requests separately.
  lookup-chunks-per-tick: 256
  # Default downward terrain slice in the Nether; avoids the bedrock roof.
  nether-depth: 64
  max-pending-maps: 256

map-walls:
  max-frames: 256
  # Minecraft supports five scales: 0 (128x128) through 4 (2048x2048).
  max-scale: 4
  discovery-span: 24
  minimum-refresh-minutes: 5
  defaults:
    refresh-minutes: 30
    locked: true
    player-markers: false
    # Off by default so placing an ordinary adjacent frame never changes it unexpectedly.
    auto-expand: false
