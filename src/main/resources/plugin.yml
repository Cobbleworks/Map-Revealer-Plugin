name: MapRevealer
version: ${project.version}
main: com.github.maprevealer.MapRevealerPlugin
api-version: "1.20"
description: Reveal held maps and automatically refresh item-frame map walls

authors:
  - Cobbleworks
website: https://github.com/Cobbleworks/Map-Revealer-Plugin

commands:
  revealmap:
    description: Reveals the map you are holding with various options
    usage: |
      /revealmap - Reveal the map in your hand
      /revealmap [depth] - Reveal at specific Y level
      /revealmap [depth] [scheme] - Reveal with a color scheme
      /revealmap reveal [depth] [theme] - Render the held map explicitly
      /revealmap lock - Lock map to prevent updates
      /revealmap schemes - List available color schemes
      /revealmap wall - Manage automatically refreshed item-frame map walls
      /revealmap wall set <name> theme <theme> - Apply a wall theme
      /revealmap wall set <name> depth <Y|auto> - Choose wall capture height
      /revealmap help - Show help
    aliases: [reveal, mapreveal]

permissions:
  maprevealer.reveal:
    description: Allows the player to reveal and lock held maps
    default: op
  maprevealer.wall.manage:
    description: Create, configure, expand, refresh, and remove managed map walls
    default: op
